# Builds the CIB deploy image for Intel/AMD and Apple silicon and pushes it to Docker Hub.
# Runs on a push to main, on a version tag (the tag must match VERSION) or by hand.
# Image: <DOCKERHUB_USERNAME>/cib-deploy:<VERSION without v>, :latest and :<VERSION without v>-<commit>.
# Repository settings: secret DOCKERHUB_TOKEN; variable DOCKERHUB_USERNAME (default: the repository owner) (Docker Hub access token, Read & Write).
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $v"; exit 1
          fi
          echo "tag=${v#v}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: pip install -q requests pytest && pytest docker -q

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/cib-deploy:${{ steps.v.outputs.tag }}
            ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/cib-deploy:${{ steps.v.outputs.tag }}-${{ steps.v.outputs.sha }}
            ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/cib-deploy:latest

      - name: Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/cib-deploy
          short-description: Deploy the Coupa Integration Baseline (CIB) into a Rossum organization. Needs only Docker.
          readme-filepath: docker/DOCKERHUB.md
